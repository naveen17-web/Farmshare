# ===================================================================
# FarmShare Spring Boot Application Configuration
# ===================================================================

server.port=8080
spring.application.name=farmshare-backend

# -------------------------------------------------------------------
# Profile Selection: 'dev' uses fast in-memory H2 database
# 'prod' connects to local/cloud MySQL server
# -------------------------------------------------------------------
spring.profiles.active=dev

# --- DEV Profile: In-Memory H2 DB (Zero external install required) ---
spring.datasource.url=jdbc:h2:mem:farmsharedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- PROD Profile: MySQL 8+ Configuration (Uncomment when running MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/farmshare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Security & JWT Configuration
farmshare.jwt.secret=FarmShareAgriPlatformSecretKey2026SecureTokenKeyForFarmersAndOwnersLongEnough
farmshare.jwt.expiration-ms=86400000

# CORS Allowed Origins
farmshare.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://farmshare.local
